<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>貼文整理小幫手</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="整理小幫手">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2f6f62">
<link rel="manifest" href="/tiezhi.webmanifest">
<link rel="apple-touch-icon" href="/tiezhi-icon-180.png">
<link rel="icon" href="/tiezhi-icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
/* 版面:像一本剪貼手帳。上方是書籤式分頁,內容是一張張收藏卡片;手機下方固定分頁列 */
:root{
  --bg:#f3f6f4; --paper:#ffffff; --ink:#1f2b2a; --muted:#5f6f6c; --line:#d8e1de;
  --accent:#2f6f62; --accent-soft:#dcebe6; --mark:#e9b949; --mark-soft:#fbf0d2; --danger:#b4443a;
  --f-display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151b1a; --paper:#1d2524; --ink:#e7eeec; --muted:#9aaba7; --line:#2f3a38;
  --accent:#7cc4b2; --accent-soft:#23403a; --mark:#e9b949; --mark-soft:#3b331c; --danger:#e57b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151b1a; --paper:#1d2524; --ink:#e7eeec; --muted:#9aaba7; --line:#2f3a38;
  --accent:#7cc4b2; --accent-soft:#23403a; --mark:#e9b949; --mark-soft:#3b331c; --danger:#e57b70; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
*{box-sizing:border-box}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .sub{color:var(--muted);font-size:13px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;max-width:130px;background:none;border:0;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button b{font-size:19px;line-height:1;font-weight:400}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.btn.small{padding:4px 12px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px}
textarea{min-height:110px;resize:vertical}
.muted{color:var(--muted)} .small{font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip i{font-style:normal;opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:12px}
.tag.mark{background:var(--mark-soft);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.post{display:flex;gap:12px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:100%}
.post .th{flex:0 0 64px;height:64px;border-radius:8px;background:var(--accent-soft);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.post .th img{width:100%;height:100%;object-fit:cover}
.post .bd{min-width:0;display:flex;flex-direction:column;gap:4px}
.post .tt{font-weight:700;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted)}
.drop.hot{border-color:var(--accent);background:var(--accent-soft)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:11px;line-height:20px;padding:0}
.job{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.job:first-child{border-top:0}
.st-ok{color:var(--accent)} .st-err{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:760px){.modal{align-items:center}.sheet{border-radius:18px;max-height:88%}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.x{border:0;background:var(--paper);border-radius:50%;width:34px;height:34px;flex:0 0 34px;font-size:16px}
ul.clean{list-style:none;margin:0;padding:0}
.ing li{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.ing .q{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.ing input{accent-color:var(--accent)}
ol.steps{padding-left:22px;margin:6px 0} ol.steps li{margin:6px 0}
.place{padding:10px 0;border-top:1px solid var(--line)} .place:first-child{border-top:0}
.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:4px}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.stop{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.stop:first-child{border-top:0}
.stop .tm{font-family:var(--f-display);font-size:16px;color:var(--accent);font-variant-numeric:tabular-nums}
.stop .bd{min-width:0}
.next{margin:6px 0 0;font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px}
.saved{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mark);margin-right:6px;vertical-align:middle}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;font-size:14px;max-width:90%}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:18px;color:var(--ink);margin-bottom:6px}
.note{background:var(--mark-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.checkl label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.checkl input{margin-top:5px;accent-color:var(--accent)}
details summary{cursor:pointer;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.post,.btn,.chip{transition:background .15s,border-color .15s}}

.post .th{position:relative}
.post .th img{position:absolute;inset:0;z-index:1}
.post .th .ic{font-size:24px}
.map{height:260px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;z-index:0}
.pin span{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--paper);font-weight:700;font-size:13px;border:2px solid var(--paper);box-shadow:0 1px 4px rgb(0 0 0 / .3)}
.stop .num{display:inline-flex;margin-top:4px;width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;align-items:center;justify-content:center;font-family:var(--f-body)}
.staybox{background:var(--mark-soft);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.staybox input,.staybox select{background:var(--paper)}
code{background:var(--accent-soft);padding:1px 6px;border-radius:4px}
html,body{margin:0}
[hidden]{display:none!important}
</style></head><body>
<div class="wrap" style="padding-top:max(18px, env(safe-area-inset-top, 0px))">
  <div class="top"><h1>貼文整理小幫手</h1><span class="sub">IG・TikTok・抖音・小紅書・臉書的收藏,自動分類</span></div>
  <main id="main"><div class="card empty"><b>讀取中…</b></div></main>
</div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="add" class="on"><b>＋</b>新增</button>
  <button data-tab="lib"><b>▤</b>收藏</button>
  <button data-tab="recipe"><b>◔</b>食譜</button>
  <button data-tab="trip"><b>✈</b>行程</button>
  <button data-tab="set"><b>⚙</b>設定</button>
</nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const CATS = ["旅遊","餐廳美食","食譜","日常生活","穿搭美妝","健身運動","居家手作","知識學習","購物好物","其他"];
const ICON = {"旅遊":"✈","餐廳美食":"🍜","食譜":"🍳","日常生活":"☀","穿搭美妝":"👗","健身運動":"💪","居家手作":"🪡","知識學習":"📖","購物好物":"🛍","其他":"📌"};
const BUSY = ["排隊中","抓取中","待整理","AI 整理中"];
const S = {tab:"add", posts:[], trips:[], loaded:false, filter:{cat:"",sub:"",place:"",q:""}, trip:null, day:0, tp:null};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; $("#toastRoot").append(el); setTimeout(()=>el.remove(),2600); }
async function api(path, opt={}){
  const o={method:opt.method||"GET", headers:{}};
  if(opt.body!==undefined){ o.headers["Content-Type"]="application/json"; o.body=JSON.stringify(opt.body); }
  const r=await fetch(path,o); const d=await r.json().catch(()=>({}));
  if(r.status===401){ showLogin(); throw new Error("請先登入"); }
  if(!r.ok) throw new Error(d.error||("出錯了 "+r.status));
  return d;
}
async function copy(text){ try{ await navigator.clipboard.writeText(text); toast("複製好了"); }catch{ openModal(`<div class="sheet-h"><h3>手動複製</h3><button class="x" data-close>✕</button></div><textarea style="min-height:260px">${esc(text)}</textarea>`); } }
const isChina = c => /中國|中国|大陸|China/i.test(c||"");
const gq = s => encodeURIComponent(s);
function mapLinks(name, city, country){
  const q=[name, city].filter(Boolean).join(" ");
  let h=`<a href="https://www.google.com/maps/search/?api=1&query=${gq(q)}" target="_blank" rel="noopener">Google 地圖</a>`;
  if(isChina(country)) h+=`<a href="https://uri.amap.com/search?keyword=${gq(name)}${city?`&city=${gq(city)}`:""}" target="_blank" rel="noopener">高德地圖</a>`;
  return h;
}

// ---------- 登入 ----------
function showLogin(){
  $("#tabs").hidden=true;
  $("#main").innerHTML=`<div class="card stack" style="max-width:420px;margin:30px auto"><h2>登入</h2><p class="small muted" style="margin:0">密碼跟自動私訊後台一樣。登入一次可以用 30 天。</p>
  <input type="password" id="pw" placeholder="密碼" style="width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px"><button class="btn primary" id="lg">登入</button><div class="small st-err" id="lgMsg"></div></div>`;
  $("#lg").onclick=async()=>{ const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})}); if(r.ok){ $("#tabs").hidden=false; boot(); } else $("#lgMsg").textContent="密碼不對"; };
  $("#pw").onkeydown=e=>{ if(e.key==="Enter") $("#lg").click(); };
}

// ---------- 資料 ----------
async function load(){
  const [p,t]=await Promise.all([api("/api/tz?a=posts"), api("/api/tz?a=trips")]);
  S.posts=p.posts.map(x=>({...x, country:normCountry(x.country), region:normRegion(x.region)})); S.trips=t.trips; S.loaded=true;
}
let pollT=null;
function schedulePoll(){
  clearTimeout(pollT);
  const busy=S.posts.some(p=>BUSY.includes(p.status)) || S.trips.some(t=>["生成中","修改中","排細節"].includes(t.status));
  if(!busy) return;
  pollT=setTimeout(async()=>{ try{ await load(); if(S.tab==="trip" && S.trip){ const t=S.trips.find(x=>x.id===S.trip.id); if(t && (t.status!==S.trip.status || t.status==="排細節") && S.stopEdit==null && !S.stayEdit) await openTrip(S.trip.id); } else if(!S.typing) render(); }catch{} schedulePoll(); }, 4000);
}
async function boot(){
  const me=await fetch("/api/admin/login").then(r=>r.json()).catch(()=>({}));
  if(!me.loggedIn) return showLogin();
  $("#tabs").hidden=false;
  try{ await load(); }catch(e){ toast(e.message); }
  const h=(location.hash||"").slice(1); if(["add","lib","recipe","trip","set"].includes(h)) S.tab=h;
  setTab(S.tab); schedulePoll();
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.loaded){ load().then(()=>{ if(!S.typing && !S.trip) render(); schedulePoll(); }).catch(()=>{}); } });

// ---------- 畫面 ----------
function setTab(t){ S.tab=t; S.trip=null; document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===t)); try{ history.replaceState(null,"","#"+t); }catch{} render(); window.scrollTo(0,0); }
$("#tabs").onclick = e => { const b=e.target.closest("button"); if(b) setTab(b.dataset.tab); };
function render(){ ({add:renderAdd, lib:renderLib, recipe:renderRecipes, trip:renderTrip, set:renderSet})[S.tab](); }

function renderAdd(){
  const busy=S.posts.filter(p=>BUSY.includes(p.status)||p.status==="失敗").slice(0,10);
  const recent=S.posts.filter(p=>p.status==="完成").slice(0,4);
  $("#main").innerHTML=`<div class="stack">
  <div class="card stack">
    <div><h2>收進一篇貼文</h2><p class="small muted" style="margin:4px 0 0">貼上 IG、TikTok、抖音、小紅書、臉書的連結就好。也可以一次貼好幾個連結。</p></div>
    <textarea id="inText" placeholder="例如:https://www.instagram.com/reel/…&#10;抖音、小紅書的分享文字整段貼上也可以"></textarea>
    <div class="row"><button class="btn primary" id="go">開始整理</button><span class="small muted">大約 30 秒~1 分鐘,可以先去做別的事</span></div>
  </div>
  ${busy.length?`<div class="card"><h3 style="margin-bottom:6px">整理進度</h3>${busy.map(p=>`<div class="job"><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.title||p.url)}</span>
    <span class="${p.status==="失敗"?"st-err":""}" style="white-space:nowrap">${esc(p.status)}${p.status==="失敗"?` <button class="btn small" data-retry="${p.id}">再試</button> <button class="btn small" data-open="${p.id}">看</button>`:""}</span></div>
    ${p.error?`<div class="small st-err" style="padding-bottom:6px">${esc(p.error)}</div>`:""}`).join("")}</div>`:""}
  ${recent.length?`<div><h3 style="margin-bottom:8px">最近收進來的</h3><div class="grid">${recent.map(postCard).join("")}</div></div>`:""}
  </div>`;
  const ta=$("#inText"); ta.value=S.draft||""; ta.oninput=()=>{ S.draft=ta.value; S.typing=true; }; ta.onblur=()=>{ S.typing=false; };
  $("#go").onclick=async()=>{
    const text=ta.value.trim(); if(!text){ toast("先貼上連結"); return; }
    const b=$("#go"); b.disabled=true;
    try{ await api("/api/tz?a=posts",{method:"POST",body:{text}}); S.draft=""; S.typing=false; toast("收到了,整理中"); await load(); renderAdd(); schedulePoll(); }
    catch(e){ toast(e.message); b.disabled=false; }
  };
  bindCards();
  $("#main").querySelectorAll("[data-retry]").forEach(b=>b.onclick=async()=>{ await api("/api/tz?a=post&id="+b.dataset.retry,{method:"POST",body:{full:true}}).catch(e=>toast(e.message)); await load(); renderAdd(); schedulePoll(); });
}
function bindCards(){ $("#main").querySelectorAll("[data-post],[data-open]").forEach(b=>b.onclick=()=>openPost(+(b.dataset.post||b.dataset.open))); }

function counts(list,key){ const m={}; list.forEach(p=>{ const k=p[key]||""; if(k) m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function renderLib(){
  const F=S.filter; const all=S.posts.filter(p=>p.status==="完成"); let list=all;
  const catList=CATS.map(c=>[c, all.filter(p=>p.category===c).length]).filter(x=>x[1]);
  if(F.cat) list=list.filter(p=>p.category===F.cat);
  const subs = F.cat==="旅遊" ? counts(list,"country") : counts(list,"subcategory");
  if(F.sub) list=list.filter(p=>(F.cat==="旅遊"?p.country:p.subcategory)===F.sub);
  const regions = F.cat==="旅遊" && F.sub ? counts(list,"region") : [];
  if(F.place) list=list.filter(p=>p.region===F.place);
  if(F.q){ const q=F.q.toLowerCase(); list=list.filter(p=>[p.title,p.summary,p.region,p.country,p.subcategory,(p.tags||[]).join(" "),(p.places||[]).map(x=>x.name).join(" ")].join(" ").toLowerCase().includes(q)); }
  $("#main").innerHTML=`<div class="stack">
    <div class="row" style="justify-content:space-between"><h2>收藏庫</h2><span class="small muted">共 ${all.length} 篇</span></div>
    <input type="text" id="q" placeholder="搜尋:店名、地區、標籤…" value="${esc(F.q)}">
    <div class="chips" id="cats"><button class="chip ${!F.cat?"on":""}" data-c="">全部<i>${all.length}</i></button>${catList.map(([c,n])=>`<button class="chip ${F.cat===c?"on":""}" data-c="${esc(c)}">${ICON[c]} ${esc(c)}<i>${n}</i></button>`).join("")}</div>
    ${F.cat && subs.length?`<div class="chips" id="subs"><span class="small muted" style="align-self:center">${F.cat==="旅遊"?"國家":"細分"}</span>${subs.map(([s,n])=>`<button class="chip ${F.sub===s?"on":""}" data-s="${esc(s)}">${esc(s)}<i>${n}</i></button>`).join("")}</div>`:""}
    ${regions.length?`<div class="chips" id="regs"><span class="small muted" style="align-self:center">地區</span>${regions.map(([s,n])=>`<button class="chip ${F.place===s?"on":""}" data-r="${esc(s)}">${esc(s)}<i>${n}</i></button>`).join("")}</div>`:""}
    ${list.length?`<div class="grid">${list.map(postCard).join("")}</div>`:`<div class="card empty"><b>${all.length?"沒有符合的收藏":"還沒有收藏"}</b>${all.length?"換個分類或關鍵字看看。":"到「新增」貼上第一篇貼文的連結,整理好會出現在這裡。"}</div>`}
  </div>`;

// ---------- 行程 ----------
// 國家、城市名稱統一(中国→中國、上海市→上海…)
const COUNTRY_ALIAS={"中国":"中國","大陸":"中國","中國大陸":"中國","China":"中國","臺灣":"台灣","Taiwan":"台灣","香港特別行政區":"香港","Hong Kong":"香港","澳门":"澳門","日本國":"日本","Japan":"日本","韓國":"韓國","南韓":"韓國","Korea":"韓國","泰国":"泰國","Thailand":"泰國"};
function normCountry(c){ c=(c||"").trim(); return COUNTRY_ALIAS[c]||c; }
function normRegion(r){ r=(r||"").trim().replace(/臺/g,"台"); return r.length>2 ? r.replace(/(市|縣|县|區|区|府)$/,"") : r; }
// 地點名稱比對用:去掉空白、標點、括號裡的外文、分店字樣
function placeKey(n){ return (n||"").toLowerCase().replace(/臺/g,"台").replace(/[（(][^）)]*[）)]/g,"").replace(/[\s·・\-_'’"“”.,，。!！?？:：/|]/g,""); }
// 名稱整理:括號裡有中文就用括號裡的(通常是繁體),再去掉後面的英文
function cleanName(n){
  n=(n||"").trim(); const m=n.match(/[（(]([^）)]*)[）)]/);
  if(m && /[\u4e00-\u9fff]/.test(m[1])) return m[1].trim();
  const noParen=n.replace(/[（(][^）)]*[）)]/g,"").trim();
  const cjk=noParen.replace(/\s+[A-Za-z0-9&®'’.\- ]+$/,"").trim();
  return /[\u4e00-\u9fff]/.test(cjk) && cjk.length>=2 ? cjk : (noParen||n);
}
function samePlace(a,b){ if(!a||!b) return false; if(a===b) return true; const [s,l]=a.length<b.length?[a,b]:[b,a]; return s.length>=3 && l.startsWith(s) && l.length-s.length<=4; }
// 收藏地點:同一個地點在好幾篇貼文出現時合併成一個
function savedPlaces(country){
  const groups=[];
  S.posts.filter(p=>p.status==="完成").forEach(p=>(p.places||[]).forEach((pl,i)=>{
    const c=normCountry(p.country); if(country && c!==country) return;
    const city=normRegion(pl.city||p.region), ck=placeKey(city);
    const nm=cleanName(pl.name); let key=placeKey(nm); if(ck && key.startsWith(ck) && key.length-ck.length>=2) key=key.slice(ck.length);
    if(!key) return;
    let g=groups.find(x=>(!x.city||!city||x.city===city) && samePlace(x.key,key));
    if(!g){ g={key, sid:p.id+":"+i, name:nm, type:pl.type, city, address:pl.address||"", notes:[], lat:pl.lat, lng:pl.lng, country:c, region:normRegion(p.region)||city, from:[]}; groups.push(g); }
    else {
      if(nm.length<g.name.length) g.name=nm; // 用比較短、乾淨的名字
      if(!g.address && pl.address) g.address=pl.address;
      if(typeof g.lat!=="number" && typeof pl.lat==="number"){ g.lat=pl.lat; g.lng=pl.lng; }
      if(!g.city && city) g.city=city;
    }
    if(pl.note && !g.notes.includes(pl.note)) g.notes.push(pl.note);
    if(!g.from.includes(p.title)) g.from.push(p.title);
  }));
  return groups.map(g=>({...g, note:g.notes.join(";").slice(0,300)}));
}

function stayQ(st){ return st ? (st.address || st.name) : ""; }
function stayLinks(st,country){
  const q=stayQ(st); if(!q) return "";
  let h=`<a href="https://www.google.com/maps/search/?api=1&query=${gq(q)}" target="_blank" rel="noopener">Google 地圖</a>`;
  if(isChina(country)) h+=`<a href="https://uri.amap.com/search?keyword=${gq(st.name||q)}" target="_blank" rel="noopener">高德地圖</a>`;
  return h;
}
function dayRouteLink(d,country,stay){
  const st=(d.stops||[]).map(s=>[s.name,s.city].filter(Boolean).join(" ")); if(stay) st.unshift(stayQ(stay)); if(st.length<2||isChina(country)) return "";
  const w=st.slice(1,-1).slice(0,8);
  return `https://www.google.com/maps/dir/?api=1&origin=${gq(st[0])}&destination=${gq(st[st.length-1])}${w.length?`&waypoints=${gq(w.join("|"))}`:""}&travelmode=transit`;
}
function itinText(t){
  const P=t.plan; const L=[P.title||t.name, P.overview||"", ""];
  (P.days||[]).forEach((d,di)=>{ L.push(`【第 ${d.day} 天】${d.date||""} ${d.area||""} ${d.theme?"・"+d.theme:""}`); const st=(P.stays||{})[di]; if(st) L.push(`🏨 今晚住:${st.name}${st.address?`(${st.address})`:""}`);
    (d.stops||[]).forEach(s=>{ L.push(`${s.time||""} ${s.name}${s.stay?`(${s.stay})`:""}`); if(s.note) L.push("  "+s.note); if(s.address) L.push("  📍 "+s.address); if(s.next) L.push(`  → ${s.next.mode||""} ${s.next.minutes?s.next.minutes+" 分鐘":""} ${s.next.detail||""}`); }); L.push(""); });
  (P.hotels||[]).forEach(h=>L.push(`🏨 ${h.area}(${h.nights||""}):${h.why||""}`)); if(P.budget) L.push("","💰 "+P.budget); return L.join("\n");
}
let map=null;
function drawMap(stops){
  const el=$("#map"); if(!el || !window.L) return;
  const pts=stops.filter(s=>typeof s.lat==="number"&&typeof s.lng==="number");
  if(!pts.length){ el.hidden=true; return; }
  if(map){ map.remove(); map=null; }
  map=L.map(el,{scrollWheelZoom:false}); L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  const ll=pts.map(s=>[s.lat,s.lng]);
  pts.forEach((s,i)=>L.marker([s.lat,s.lng],{icon:L.divIcon({className:"pin",html:`<span>${i+1}</span>`,iconSize:[26,26]})}).addTo(map).bindPopup(esc(s.name)));
  L.polyline(ll,{color:getComputedStyle(document.documentElement).getPropertyValue("--accent")||"#2f6f62",weight:3,opacity:.7,dashArray:"6 6"}).addTo(map);
  map.fitBounds(ll,{padding:[30,30],maxZoom:15});
}

    const name=$("#sfName").value.trim(); if(!name){ toast("請填地點名稱"); return; }
    const old=S.stopEdit==="new"?{}:d.stops[S.stopEdit]; const nx=$("#sfNext").value.trim();
    const stop={...old, time:$("#sfTime").value, name, type:$("#sfType").value, stay:$("#sfStay").value.trim(), cost:$("#sfCost").value.trim(), address:$("#sfAddr").value.trim(), note:$("#sfNote").value.trim(),
      next: nx ? (old.next && [old.next.mode,old.next.minutes?old.next.minutes+" 分鐘":"",old.next.detail].filter(Boolean).join(" ")===nx ? old.next : {mode:"",minutes:null,detail:nx}) : null};
    if(old.name && old.name!==name){ delete stop.lat; delete stop.lng; }
    d.stops ||= [];
    if(S.stopEdit==="new") d.stops.push(stop); else d.stops[S.stopEdit]=stop;
    if(stop.time) d.stops.sort((a,b)=>(a.time||"99")<(b.time||"99")?-1:(a.time||"99")>(b.time||"99")?1:0);
    S.stopEdit=null; renderItin(); await saveTrip(); toast("存好了");
  });
  $("#delIt").onclick=()=>{ $("#delAsk").hidden=false; }; $("#delNo").onclick=()=>{ $("#delAsk").hidden=true; };
  $("#delYes").onclick=async()=>{ try{ await api("/api/tz?a=trip&id="+t.id,{method:"DELETE"}); S.trip=null; await load(); renderTrip(); toast("刪掉了"); }catch(e){ toast(e.message); } };
  $("#dt").onclick=e=>{ const b=e.target.closest("[data-d]"); if(b){ S.day=+b.dataset.d; S.stayEdit=null; S.stopEdit=null; renderItin(); } };
  const edit=async fn=>{ fn(d.stops); renderItin(); await saveTrip(); };
  $("#main").querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>edit(a=>{ const i=+b.dataset.up; [a[i-1],a[i]]=[a[i],a[i-1]]; }));
  $("#main").querySelectorAll("[data-down]").forEach(b=>b.onclick=()=>edit(a=>{ const i=+b.dataset.down; [a[i+1],a[i]]=[a[i],a[i+1]]; }));
  $("#main").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>edit(a=>a.splice(+b.dataset.rm,1)));
  $("#main").querySelectorAll("[data-mv]").forEach(s=>s.onchange=()=>{ if(s.value==="") return; const j=+s.value; edit(a=>{ const [x]=a.splice(+s.dataset.mv,1); (days[j].stops ||= []).push(x); }); });
  $("#addSaved") && ($("#addSaved").onchange=e=>{ const x=t.places.find(p=>p.sid===e.target.value); if(x) edit(a=>a.push({time:"",name:x.name,city:x.city,type:x.type,saved_id:x.sid,lat:x.lat,lng:x.lng,note:x.note||"",next:null})); });
  const openStay=(pre={})=>{ const cur=(P.stays||{})[S.day]||{}; S.stayEdit={name:pre.name??cur.name??"", address:pre.address??cur.address??"", from:S.day, to:S.day}; renderItin(); $(".staybox")?.scrollIntoView({block:"center"}); };
  $("#stAdd") && ($("#stAdd").onclick=()=>openStay());
  $("#stEdit") && ($("#stEdit").onclick=()=>openStay());
  $("#main").querySelectorAll("[data-pick-hotel]").forEach(b=>b.onclick=()=>{ openStay({name:b.dataset.pickHotel, address:""}); toast("記得補上地址,再按儲存"); });
  $("#stCancel") && ($("#stCancel").onclick=()=>{ S.stayEdit=null; renderItin(); });
  $("#stClear") && ($("#stClear").onclick=async()=>{ delete (P.stays||{})[S.day]; S.stayEdit=null; renderItin(); await saveTrip(); });
  $("#stSave") && ($("#stSave").onclick=async()=>{
    const name=$("#stName").value.trim(), address=$("#stAddr").value.trim(); if(!name && !address){ toast("至少填飯店名稱或地址"); return; }
    let a=+$("#stFrom").value, b=+$("#stTo").value; if(b<a) [a,b]=[b,a];
    P.stays ||= {}; for(let j=a;j<=b;j++) P.stays[j]={name:name||address, address};
    S.stayEdit=null; renderItin(); await saveTrip(); toast("住宿存好了");
  });
  $("#refGo").onclick=async()=>{ const ins=$("#ref").value.trim(); if(!ins){ toast("先寫想怎麼改"); return; }
    try{ await api("/api/tz?a=trip&id="+t.id,{method:"POST",body:{instruction:ins}}); t.status="修改中"; await load(); renderItin(); schedulePoll(); }catch(e){ toast(e.message); } };
}

      <div>抓貼文服務(Apify):${s.apify?"✅ 已設定":"❌ 還沒設定"}</div>
